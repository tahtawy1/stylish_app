name: stylish_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  shared_preferences: ^2.5.5

  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  go_router: ^17.3.0
  dartz: ^0.10.1
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  email_validator: ^3.0.0
  animated_text_kit: ^4.3.0
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.1.2
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1

    
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  intl_utils: ^2.8.14

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
flutter_intl:
  enabled: true
